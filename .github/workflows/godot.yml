name: RTS verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check offline browser demo and shared balance snapshot
        run: |
          python3 tools/sync_browser_demo.py --check
          node tests/browser_demo_model.cjs
          node tests/browser_missions_model.cjs
      - name: Install pinned Godot standard runtime
        shell: bash
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 --output .tools/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo "87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  .tools/godot.zip" | sha256sum --check --strict
          unzip -q .tools/godot.zip -d .tools
          chmod +x .tools/Godot_v4.5.2-stable_linux.x86_64
      - name: Import, Stage 1–5 regressions, balance/reload tests, demos, and scene smoke
        run: python3 tools/verify.py --godot .tools/Godot_v4.5.2-stable_linux.x86_64
      - name: Show simulation report
        if: always()
        shell: bash
        run: |
          for report in test-results/stage1.json test-results/stage2.json test-results/stage3.json test-results/stage4.json test-results/stage5.json test-results/stage5_python.json; do
            if [ -f "$report" ]; then
              cat "$report"
            fi
          done
